apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-python-app-helm-release-my-python-app-chart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-python-app
  template:
    metadata:
      labels:
        app: my-python-app
    spec:
      containers:
        - name: my-python-app
          image: gcr.io/soy-vision-389617/my-python-app-server:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 5050
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: my-python-app-service
spec:
  type: LoadBalancer
  selector:
    app: my-python-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5050
