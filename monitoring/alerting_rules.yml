groups:
  - name: highway9-telemetry
    interval: 2s
    rules:
      - alert: TelemetryIngestLatencyOverFiveSeconds
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(telemetry_ingest_request_seconds_bucket[1m]))) > 5
        for: 2s
        labels:
          severity: critical
        annotations:
          summary: Telemetry ingest p95 is above five seconds
          description: The Flutter-to-Flask ingest path has exceeded its latency SLO.

      - alert: TelemetryQueueBacklog
        expr: telemetry_pipeline_queue_depth > 50000
        for: 4s
        labels:
          severity: warning
        annotations:
          summary: Telemetry publisher queue is above 50 percent capacity
          description: Scale the Flask deployment or inspect the Pub/Sub publisher.

      - alert: TelemetryIngestDown
        expr: sum(rate(telemetry_events_received_total[1m])) == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: No telemetry has been accepted for 30 seconds

      - alert: TelemetryRejectRateHigh
        expr: |
          sum(rate(telemetry_events_rejected_total[1m]))
          /
          clamp_min(sum(rate(telemetry_events_received_total[1m])), 1) > 0.01
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: More than one percent of telemetry is being rejected

      - alert: TelemetryPublishErrors
        expr: increase(telemetry_publish_errors_total[1m]) > 0
        for: 2s
        labels:
          severity: critical
        annotations:
          summary: Telemetry could not be published to the analytics backend
